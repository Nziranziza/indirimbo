<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Indirimbo</title>
    <script>
      // Preserve the original path for SPA routing on GitHub Pages.
      (function () {
        var basePath = '';
        var path = window.location.pathname + window.location.search + window.location.hash;

        if (basePath && path.indexOf(basePath) === 0) {
          path = path.slice(basePath.length);
        }

        if (path === '') {
          path = '/';
        }

        try {
          sessionStorage.setItem('spa-redirect', path);
        } catch (e) {
          // Ignore storage errors and just redirect to base.
        }

        window.location.replace((basePath || '') + '/');
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
