<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Indirimbo</title>
    <script>
      // Preserve the original path for SPA routing on GitHub Pages.
      (function () {
        var basePath = '__BASE_PATH__';
        var path = window.location.pathname + window.location.search + window.location.hash;

        if (basePath && path.indexOf(basePath) === 0) {
          path = path.slice(basePath.length);
        }

        if (path === '') {
          path = '/';
        }

        var redirectUrl = (basePath || '') + '/?spa-redirect=' + encodeURIComponent(path);
        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
